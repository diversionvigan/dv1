version: '3.8'

services:
  diversion-vigan-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diversion_vigan_app
    restart: unless-stopped
    ports:
      # Map host port 3000 (or set HOST_PORT in .env) to container port 3000
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-}
    volumes:
      # Persistent bookings, inquiries, rooms inventory, and reviews storage
      - ./data:/app/data
      # Persistent guest payment slips and uploaded room photos
      - ./public/uploads:/app/public/uploads
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: diversion_vigan_net
